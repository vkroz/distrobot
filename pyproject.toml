[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-publisher"
version = "0.2.0"
description = "Upload one video, tailor it per platform, and publish or schedule it to YouTube, TikTok, Instagram Reels, X, Facebook Pages, LinkedIn and Vimeo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "regex>=2024.4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
creator-publisher = "creator_publisher.__main__:main"

[tool.setuptools.packages.find]
include = ["creator_publisher*"]

[tool.setuptools.package-data]
creator_publisher = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
